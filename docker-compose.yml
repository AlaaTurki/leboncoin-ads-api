services:
  ads-api:
    build:
      context: .
      dockerfile: ads/internal/cmd/ads-api/Dockerfile
    environment:
      HTTP_ADDR: "${ADS_HTTP_ADDR:-:8080}"
      DATABASE_URL: "${ADS_DATABASE_URL:-postgres://ads:ads@ads-database:5432/ads?sslmode=disable}"
      IDENTITY_URL: "${ADS_IDENTITY_URL:-http://users-api:8081}"
      IDENTITY_TIMEOUT: "${ADS_IDENTITY_TIMEOUT:-2s}"
    ports:
      - "${ADS_API_PORT:-8080}:8080"
    depends_on:
      ads-database:
        condition: service_healthy
      users-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 20

  ads-database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${ADS_POSTGRES_USER:-ads}"
      POSTGRES_PASSWORD: "${ADS_POSTGRES_PASSWORD:-ads}"
      POSTGRES_DB: "${ADS_POSTGRES_DB:-ads}"
    ports:
      - "${ADS_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ./ads/internal/cmd/ads-api/dao/postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ADS_POSTGRES_USER:-ads} -d ${ADS_POSTGRES_DB:-ads}"]
      interval: 2s
      timeout: 2s
      retries: 20


  users-api:
    build:
      context: .
      dockerfile: users/internal/cmd/users-api/Dockerfile
    environment:
      HTTP_ADDR: "${ADS_USERS_HTTP_ADDR:-:8081}"
    ports:
      - "${ADS_USERS_API_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8081/health"]
      interval: 2s
      timeout: 2s
      retries: 20
