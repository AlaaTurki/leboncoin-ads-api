openapi: "3.0.3"

info:
  title: Ads API
  description: Classified ads — list, read, create, and delete ads.
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      tags: [infra]
      responses:
        "200":
          description: Service is up

  /ads:
    get:
      summary: List ads
      operationId: listAds
      tags: [ads]
      parameters:
        - name: limit
          in: query
          description: Maximum number of ads to return (default 50, maximum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Number of matching ads to skip (default 0).
          schema:
            type: integer
            minimum: 0
        - name: title
          in: query
          description: Case-insensitive substring match on the ad title.
          schema:
            type: string
          example: bike
        - name: user_id
          in: query
          description: Filter ads belonging to this owner.
          schema:
            type: string
          example: "00000000-0000-0000-0000-000000000001"
        - name: min_price
          in: query
          description: Inclusive lower bound on the price in the currency unit. 0 means no lower bound.
          schema:
            type: number
            format: float
            minimum: 0
          example: 50.00
        - name: max_price
          in: query
          description: Inclusive upper bound on the price in the currency unit. 0 means no upper bound.
          schema:
            type: number
            format: float
            minimum: 0
          example: 500.00
      responses:
        "200":
          description: List of matching ads (may be empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAdsResponse"
        "400":
          description: Invalid query parameter (e.g. non-numeric price).

    post:
      summary: Create an ad
      operationId: createAd
      tags: [ads]
      security:
        - userID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdBody"
      responses:
        "201":
          description: Ad created. The body contains the generated identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAdResponse"
        "400":
          description: Malformed or unknown request body field.
        "401":
          description: Missing Authorization header.
        "429":
          description: Posting quota exceeded (five ads in the previous 24 hours).
          headers:
            Retry-After:
              description: Seconds before retrying.
              schema:
                type: integer
        "500":
          description: Unexpected server error.
        "502":
          description: The identity service could not return the ad owner's username.

  /ads/import:
    post:
      summary: Import ads atomically
      operationId: importAds
      tags: [ads]
      security:
        - userID: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ads]
              properties:
                ads:
                  type: array
                  items:
                    $ref: "#/components/schemas/CreateAdBody"
      responses:
        "201":
          description: All ads imported or original IDs replayed for an identical retry.
        "400":
          description: Invalid body or missing/invalid idempotency key.
        "413":
          description: Import contains more than 500 ads or exceeds 2 MiB.
        "409":
          description: Idempotency key reused with a different payload.
        "500":
          description: Unexpected server error.

  /ads/{adID}:
    get:
      summary: Get an ad by ID
      operationId: getAd
      tags: [ads]
      parameters:
        - name: adID
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: The requested ad.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ad"
        "400":
          description: adID is not a valid integer.
        "404":
          description: No ad exists with this ID.
        "500":
          description: Unexpected server error.
        "502":
          description: The identity service is unavailable while resolving the owner's username.
    delete:
      summary: Delete an ad owned by the authenticated user
      operationId: deleteAd
      tags: [ads]
      security:
        - userID: []
      parameters:
        - name: adID
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Ad deleted.
        "401":
          description: Missing Authorization header.
        "404":
          description: Ad does not exist or belongs to another user.
        "500":
          description: Unexpected server error.

components:
  securitySchemes:
    userID:
      type: apiKey
      in: header
      name: Authorization
      description: The caller's user ID. No token validation is performed — the value is used as-is as the owner identifier.

  schemas:
    Ad:
      type: object
      required: [id, title, price, username, photo_url, user_id, created_at]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: mountain bike
        price:
          type: number
          format: float
          description: Price in the currency unit, with up to two decimal places.
          example: 150.00
        username:
          type: string
          description: Nickname of the ad owner.
          example: alice
        photo_url:
          type: string
          example: https://example.com/bike.jpg
        user_id:
          type: string
          example: "00000000-0000-0000-0000-000000000001"
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:00:00Z"

    ListAdsResponse:
      type: object
      required: [ads]
      properties:
        ads:
          type: array
          items:
            $ref: "#/components/schemas/AdSummary"

    AdSummary:
      type: object
      required: [id, title, price, photo_url, user_id, created_at]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: mountain bike
        price:
          type: number
          format: float
          description: Price in the currency unit, with up to two decimal places.
          example: 150.00
        photo_url:
          type: string
          example: https://example.com/bike.jpg
        user_id:
          type: string
          example: "00000000-0000-0000-0000-000000000001"
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:00:00Z"

    CreateAdBody:
      type: object
      required: [title, price, photo_url]
      properties:
        title:
          type: string
          example: mountain bike
        price:
          type: number
          format: float
          description: Price in the currency unit, with up to two decimal places.
          example: 150.00
        photo_url:
          type: string
          example: https://example.com/bike.jpg

    CreateAdResponse:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
          description: Generated identifier of the new ad.
          example: 42
